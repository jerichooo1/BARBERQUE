<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hair Debug</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #d9d9d9;
      font-family: Arial, sans-serif;
    }
    #info {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(0,0,0,0.75);
      color: white;
      padding: 12px 14px;
      border-radius: 10px;
      max-width: 320px;
    }
  </style>
</head>
<body>
  <div id="info">Loading debug model...</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.179.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.179.1/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const info = document.getElementById('info');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xd9d9d9);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.01, 1000);
    camera.position.set(0, 1.5, 4);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 0.8, 0);

    scene.add(new THREE.AmbientLight(0xffffff, 2.5));

    const dir = new THREE.DirectionalLight(0xffffff, 1.5);
    dir.position.set(3, 4, 5);
    scene.add(dir);

    scene.add(new THREE.GridHelper(10, 20));
    scene.add(new THREE.AxesHelper(2));

    const loader = new GLTFLoader();

    loader.load(
      './hairs/haircut1.glb',
      (gltf) => {
        const model = gltf.scene;
        console.log('FULL MODEL:', model);

        let meshCount = 0;
        let totalVertices = 0;

        model.traverse((obj) => {
          console.log('NODE:', obj.type, obj.name, obj);

          if (obj.isMesh) {
            meshCount++;

            const pos = obj.geometry?.attributes?.position;
            const vertexCount = pos ? pos.count : 0;
            totalVertices += vertexCount;

            console.log('MESH:', obj.name, 'vertices:', vertexCount);

            obj.visible = true;

            obj.material = new THREE.MeshBasicMaterial({
              color: 0xff0000,
              side: THREE.DoubleSide,
              transparent: false,
              opacity: 1
            });
          }
        });

        const box = new THREE.Box3().setFromObject(model);
        const size = new THREE.Vector3();
        const center = new THREE.Vector3();
        box.getSize(size);
        box.getCenter(center);

        console.log('meshCount =', meshCount);
        console.log('totalVertices =', totalVertices);
        console.log('MODEL SIZE =', size);
        console.log('MODEL CENTER =', center);

        model.position.sub(center);

        const maxDim = Math.max(size.x, size.y, size.z);

        if (maxDim > 0 && Number.isFinite(maxDim)) {
          const scale = 2 / maxDim;
          model.scale.setScalar(scale);
        } else {
          console.warn('Invalid bounding box size. Using fallback scale.');
          model.scale.setScalar(1);
        }

        scene.add(model);

        const helper = new THREE.Box3Helper(new THREE.Box3().setFromObject(model), 0xffff00);
        scene.add(helper);

        info.innerHTML =
          'Loaded.<br>' +
          'Open console now.<br>' +
          'Look for meshCount, totalVertices, MODEL SIZE.';
      },
      undefined,
      (err) => {
        console.error(err);
        info.textContent = 'Failed to load model.';
      }
    );

    function animate() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
